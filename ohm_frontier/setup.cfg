# Where `frontier_node` ends up when the package is installed. Without this a setuptools installs the
# console script next to `bin/`, and `Node(package="ohm_frontier", executable="frontier_node")` then
# reports: package found, but libexec directory .../lib/ohm_frontier does not exist.
[develop]
script_dir=$base/lib/ohm_frontier
[install]
install_scripts=$base/lib/ohm_frontier
