# slam_toolbox, set up to map a hall that a simulator is driving the robot around in.
#
# Loaded by launch/explore.launch.py, which also passes `map_frame`, `odom_frame`, `base_frame`,
# `scan_topic` and `use_sim_time` — those depend on the robot's name and are computed there. The numbers
# below are the ones worth arguing about, so they are written out rather than left at defaults.
#
# Node name is `slam_toolbox`, which is what `async_slam_toolbox_node` calls itself.

slam_toolbox:
  ros__parameters:
    # The optimiser. Ceres needs these named; leaving them out is the usual reason this node dies at
    # startup with a message about the solver plugin.
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRUST_REGION
    ceres_loss_function: None

    # 5 cm cells. The lidar is good to a few centimetres and the doors of `rooms` are 1.0 m wide, so 5 cm
    # is fine enough to see an opening and coarse enough that a 22 × 16 m hall is 440 × 320 cells.
    resolution: 0.05

    # The hall is 22 m across, the lidar reports up to 8 m, and a beam that reaches past the room it is in
    # tells the mapper nothing about a wall anyway. Anything past 12 m is treated as "no echo".
    max_laser_range: 12.0
    max_range: 8.0            # the simulator's own range_max; further than this is unknown, not free
    minimum_range: 0.15       # a closer reading than this is the robot's own mast
    inf_is_valid: true        # an echo of `inf` means "no wall here", and must not be dropped as invalid

    # How often a new submap is solved and published. A student watching RViz wants to see the hall appear
    # in seconds; 5 s (the upstream default) reads as broken in a 120 s exercise.
    map_update_interval: 1.5
    transform_publish_period: 0.05
    throttle_scans: 1

    # A scan is only added to the graph once the robot has moved this much. The exercise has the robot
    # crawl through doorways, so the upstream 0.5 m would skip most of what makes `rooms` interesting.
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.15
    use_scan_matching: true         # align scans to each other rather than trusting the odometry
    use_scan_barycenter: true
    do_loop_closing: true           # the corridor in `rooms` is walked back and forth: that is a loop

    # Two scans of the same doorway that disagree by more than this are not glued together. Corridors with
    # one wall each are where a too-large value smears two walls into one thick one.
    correlation_distance: 0.15
    correction_variance: 2.0

    # 40 MB of stack: the Ceres solve on a hall this size wants more than the default.
    stack_size_to_use: 40000000
