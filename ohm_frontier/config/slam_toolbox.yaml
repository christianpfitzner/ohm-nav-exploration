# slam_toolbox, mapping a hall that a simulator drives a robot around in.
#
# Read by launch/explore.launch.py, which replaces every `<robot>` with the robot's name before handing the
# file over — slam_toolbox names frames and topics absolutely and is given a file, not parameters, so the
# name has to be in the file. Everything here that is not upstream's default has a reason next to it.
#
# The node calls itself `slam_toolbox`, which is what `async_slam_toolbox_node` names itself, and it is a
# lifecycle node: it maps only once something has activated it. The launch file includes slam_toolbox's own
# `online_async_launch.py`, which does that; starting the executable alone leaves it sitting in
# „unconfigured" and publishing nothing, which looks exactly like a broken scan topic.

slam_toolbox:
  ros__parameters:
    # Frames. `map → <robot>/odom` is slam_toolbox's to publish, and the simulator keeps out of it — that
    # edge is handed over with `tf_tree:=slam` (see the picture at the top of launch/explore.launch.py).
    # The hall's own coordinates live in the frame `hall` from there on.
    map_frame: map
    odom_frame: <robot>/odom
    base_frame: <robot>/base_link
    scan_topic: /<robot>/scan
    mode: mapping

    # The optimiser. Ceres needs these named; leaving them out is the usual reason this node dies at
    # startup with a message about the solver plugin.
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # 5 cm cells: fine enough to see a 1.0 m door as a door, coarse enough not to think about memory. The
    # window that comes up at spawn is 221 × 171 cells, and it grows with the robot — 222 × 233 after 20 s
    # of driving.
    resolution: 0.05

    # Just under the laser's own maximum, so a reading at the maximum can only mean "no echo" here. What a
    # missing echo *is* on the wire is the simulator's `sensor.lidar.no_echo`, and this launch file asks for
    # `inf`: with the other dialect (8.0 m, the laser's own range) the map of a hall with walls at 2 to 3.4 m
    # stayed at 1 414 free cells and 2 walls. That is a dialect question, not a parameter one — measured with
    # `max_laser_range` at 7.9, 12 and 20 and the free count did not move by 25 cells.
    min_laser_range: 0.15     # closer than this is the robot's own mast
    max_laser_range: 7.9      # 0.1 m under the laser's maximum

    # A standing robot is not a mapping robot: with these thresholds the map of a hall stays at ~1 400 free
    # cells until the robot has moved 0.2 m, and then it holds 18 022 free cells and 767 walls from the same
    # 20 s. Whatever reads the map at spawn is reading an empty one, which is why the frontier node has a
    # `walk_out` goal rather than a wait loop.

    # How often a submap is solved and published. Upstream's 5 s reads as broken in a two-minute exercise
    # where the robot is crawling through doorways; 1.5 s is what makes the hall appear while it happens.
    map_update_interval: 1.5
    transform_publish_period: 0.05
    throttle_scans: 1

    # A scan joins the graph once the robot has moved this far or turned this much. Upstream's 0.5 m / 0.5
    # rad skips most of what makes the `rooms` hall the interesting case: doorways at a metre width.
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.15
    use_scan_matching: true           # align scans to each other, rather than believing the odometry
    use_scan_barycenter: true
    do_loop_closing: true             # the corridor in `rooms` gets walked back and forth: that is a loop
    loop_search_maximum_distance: 3.0

    # 40 MB of stack: the Ceres solve wants more than the default gives it.
    stack_size_to_use: 40000000
