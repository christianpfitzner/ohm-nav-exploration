# nav2 for one simulated robot in a hall that is being mapped while it drives.
#
# Only what differs from nav2's own defaults is written here, and one thing that has to be kept in step with
# the launch file: the robot's name. Every `<robot>/` below is replaced with it before nav2 sees the file, so
# `robot:=carlo` in the launch file and this file are one setting, not two.
#
# The tree is `map → <robot>/odom → <robot>/base_link → <robot>/laser`: `map → <robot>/odom` from
# slam_toolbox, everything under it from the simulator, which is told to keep off that one edge
# (`tf_tree:=slam`). Positions the simulator measures from the corner of its hall — GPS, truth — are in the
# frame `hall`, which is why none of them appear here.
#
# There is no AMCL and no map_server: the robot is told where it is by the simulator, and the map is made as
# it drives. `track_unknown_space` is therefore on everywhere — unknown cells are what the whole package is
# looking for, and a costmap that paints them free leaves the robot no frontier to be sent to.
#
# **The two costmaps are sections of their own, not parts of the server that reads them.** nav2 runs them as
# separate nodes named `local_costmap` and `global_costmap`; nested under `controller_server:` they are read
# as parameters of that node and the costmap comes up with its defaults — measured: it then waited for a
# transform from `base_link` to `map`, a pair this tree does not contain, the controller never activated, and
# the whole stack stayed unusable while nothing in the log mentioned the costmap's parameters.
#
# **`enable_stamped_cmd_vel` is false on all four nodes of the command chain, and they are one setting, not
# four.** Every nav2 node that writes or reads a velocity command has this switch, and it picks the *message
# type* of the hop, not its rate: true is `geometry_msgs/msg/TwistStamped`, false is `geometry_msgs/msg/Twist`.
# Kilted ships it as **true**; the simulator listens to `/<robot>/cmd_vel` as a `Twist` (`CONTRACT` §6.9, and
# one Twist is what a student's own node publishes with the keyboard). DDS will not connect a publisher and a
# subscription of different types, and it says nothing when it does not — measured with a goal 1.5 m away: 20 Hz
# on `/cmd_vel_nav`, `/cmd_vel_smoothed` and `/muster/cmd_vel`, all three `TwistStamped`, all three carrying
# `vx=+0.350` the whole time, the collision monitor passing every one of them through, and the robot standing
# at its spawn with the odometry not moving 0.01 m. The map, the plan, the costmaps and the view were all
# right; only the last hop was wire that nothing was listening on. `ros2 topic echo` and `--hz` answer "no
# messages" for a topic whose published type differs from the one they guessed, which is why this took a
# subscriber of each type side by side to see. Set one of the four to true and that is the whole failure again.

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    enable_stamped_cmd_vel: False         # a Twist on /cmd_vel_nav, which is what the smoother reads
    odom_topic: /<robot>/odom
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.10        # this much motion in the allowance below is progress
      movement_time_allowance: 30.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 3.14              # a frontier has no right way of facing it
      stateful: True
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.35              # the same walking pace the keyboard drives at
      max_robot_pose_search_dist: 6.0
      reg_lookahead_dist: 0.50
      use_collision_detection: True
      costmap_topic: local_costmap/costmap_raw
      footprint_topic: local_costmap/published_footprint

planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 2.0         # the map grows while the robot drives: replan often
    # The id is not free to choose: the tree in `navigate_to_pose_w_replanning_and_recovery.xml` asks the
    # planner for `GridBased` by name. Measured with a section that named itself `Grid` instead — every goal
    # came back „Planner id GridBased is invalid", the message naming the only planner it could see.
    planner_plugins: [GridBased]
    allow_unknown: True                     # the frontier *is* the edge of the unknown
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.30                       # a goal in an inflated cell stays a goal within this much
      allow_unknown: True
      downsample_costmap: True
      downsample_resolution: 0.1
      max_planning_time: 2.0

behavior_server:
  ros__parameters:
    use_sim_time: True
    enable_stamped_cmd_vel: False         # the recovery drives (spin, backup) are commands too
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    global_frame: <robot>/odom
    robot_base_frame: <robot>/base_link
    transform_tolerance: 1.0
    # The tree nav2 ships in `navigate_to_pose_w_replanning_and_recovery.xml` asks for all four of these by
    # name while it is being *built*: leave `spin` out and bt_navigator answers „Action server spin not
    # available" during activation, which takes the bringup down although the behaviour server itself is up.
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
      simulate_ahead_time: 1.0
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
      simulate_ahead_time: 1.0
    wait:
      plugin: nav2_behaviors::Wait

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-2
      max_its: 1000

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    enable_stamped_cmd_vel: False         # reads /cmd_vel_nav and writes /cmd_vel_smoothed, both as Twists
    odom_topic: /<robot>/odom
    smoothing_frequency: 20.0
    max_velocity: [0.40, 0.0, 1.0]          # the model drives these numbers without slipping
    min_velocity: [-0.30, 0.0, -1.0]

# This section is here because nav2's own lifecycle manager insists on it. `navigation_launch.py` configures
# controller, smoother, planner, route, behaviour, velocity_smoother, collision monitor and docking server in
# one chain, and a node that cannot configure aborts the whole bringup — measured: with no
# `collision_monitor` section the manager stopped at that node, `bt_navigator` stayed unconfigured, and no
# `/navigate_to_pose` server ever came up, which from the outside looks like an explorer that never drives.
# Names and values as nav2 ships them, with this robot's frames and the topic the simulator listens to.
collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: <robot>/base_link
    odom_frame_id: <robot>/odom
    enable_stamped_cmd_vel: False         # in as a Twist, and out to the simulator as a Twist
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: /<robot>/cmd_vel   # the topic the simulator drives from, as a Twist
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: [FootprintApproach]
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: local_costmap/published_footprint
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: [scan]
    scan:
      type: scan
      topic: /<robot>/scan
      min_height: 0.15
      max_height: 2.0
      enabled: True

# This robot has no charging dock and never will. The section is here because `docking_server` is in that
# same fixed node list, with no argument to leave it out, and it answers „Charging dock plugins not given!"
# and takes the bringup down with it. One plugin entry that is never used is what it needs in order to say
# that it has nothing to dock to.
docking_server:
  ros__parameters:
    use_sim_time: True
    base_frame: <robot>/base_link
    fixed_frame: <robot>/odom
    dock_plugins: [simple_charging_dock]
    simple_charging_dock:
      plugin: opennav_docking::SimpleChargingDock
      dock_direction: forward
      use_external_detection_pose: False
      use_battery_status: False
      use_stall_detection: False

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map                       # goals arrive in the map the frontier node read
    robot_base_frame: <robot>/base_link
    odom_topic: /<robot>/odom
    bt_loop_duration: 20
    default_server_timeout: 40
    wait_for_service_timeout: 1000

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: False

# ------------------------------------------------------------------------------------------- the costmaps

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: <robot>/odom            # the local map hangs off the odometry, as nav2 intends
      robot_base_frame: <robot>/base_link
      odom_topic: /<robot>/odom
      rolling_window: True
      width: 4                              # 4 m around the robot is what a collision check looks at
      height: 4
      resolution: 0.05
      transform_tolerance: 0.5
      track_unknown_space: True
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /<robot>/scan
          sensor_frame: <robot>/laser
          data_type: LaserScan
          marking: True
          clearing: True
          max_range: 8.0                    # what the simulator's lidar reports
          expected_update_rate: 10.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.45              # the robot is 0.46 m across, with a little respect left
        cost_scaling_factor: 5.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: map                     # slam_toolbox's map, which is the one that grows
      robot_base_frame: <robot>/base_link
      odom_topic: /<robot>/odom
      rolling_window: False                 # the whole map, not a window: frontiers are far away
      always_send_full_costmap: True
      transform_tolerance: 0.5
      track_unknown_space: True
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map                     # slam_toolbox publishes it, and keeps publishing it
        track_unknown_space: True
        always_send_full_costmap: True
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /<robot>/scan
          sensor_frame: <robot>/laser
          data_type: LaserScan
          marking: True
          clearing: False                   # the map is the mapper's business; this layer only adds to it
          max_range: 8.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.45
        cost_scaling_factor: 5.0
